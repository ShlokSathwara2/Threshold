services:
  - type: web
    name: threshold-backend
    runtime: python
    buildCommand: pip install -r requirements.txt && PLAYWRIGHT_BROWSERS_PATH=0 playwright install --with-deps chromium chromium_headless_shell
    startCommand: cd backend && PLAYWRIGHT_BROWSERS_PATH=0 python main.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: CORS_ORIGINS
        sync: false
