# fly.toml app configuration file for Threshold Backend
app = "threshold-backend"
primary_region = "bom" # Mumbai, India (closest to SRM servers)

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
